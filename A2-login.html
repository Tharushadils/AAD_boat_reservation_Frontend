<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AquaVenture Water Sports & Boat Rentals</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="A2-login.css">

    <style>
        .auth-wrapper {
            min-height: 100vh;
            position: relative;
            background: url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }

        .auth-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(7, 28, 48, 0.85) 0%, rgba(7, 28, 48, 0.96) 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            position: relative;
            z-index: 2;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            padding: 12px 16px 12px 45px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #10a7a1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(16, 167, 161, 0.35);
        }

        .form-control-custom::placeholder {
            color: #94a3b8;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #10a7a1;
            font-size: 1.1rem;
            z-index: 5;
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-check-input:checked {
            background-color: #10a7a1;
            border-color: #10a7a1;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            margin: 25px 0;
            font-size: 0.85rem;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .auth-divider span {
            padding: 0 10px;
        }

        .toast-msg {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: left;
        }

        .toast-msg.error {
            background: rgba(244, 63, 94, 0.2);
            border: 1px solid #f43f5e;
            color: #ff8e8e;
        }

        .toast-msg.success {
            background: rgba(16, 167, 161, 0.2);
            border: 1px solid #10a7a1;
            color: #34d399;
        }
    </style>
</head>

<body>

    <!-- Back to Home Floating Link -->
    <a href="index.html"
        class="btn btn-glass-secondary position-fixed top-0 start-0 m-4 z-3 d-flex align-items-center gap-2 text-decoration-none py-2 px-3">
        <i class="fa-solid fa-arrow-left"></i> Home
    </a>

    <div class="auth-wrapper">

        <div class="auth-overlay"></div>

        <div class="glass-card auth-card text-center">

            <!-- Brand Logo -->
            <div class="mb-4">

                <a href="index.html" class="text-decoration-none">

                    <div class="splash-kayak-icon mb-2" style="font-size: 2.8rem; color: #10a7a1;">
                        <i class="fa-solid fa-ship"></i>
                    </div>

                    <h2 class="fw-bold text-white mb-0" style="font-family: 'Manrope', sans-serif;">

                        Aqua<span class="text-gradient">Venture</span>

                    </h2>

                </a>

                <p class="text-muted-light fs-7 mt-1">
                    Welcome back! Sign in to manage water excursions.
                </p>

            </div>

            <!-- Toast alert -->
            <div id="loginToast" class="toast-msg"></div>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="mb-3 text-start">

                    <label class="form-label text-muted-light small fw-medium">
                        Email or Username
                    </label>

                    <div class="input-group-custom">

                        <i class="fa-solid fa-envelope input-icon"></i>

                        <input type="text" id="usernameInput" class="form-control form-control-custom"
                            placeholder="name@example.com or admin" required>

                    </div>

                </div>

                <div class="mb-3 text-start">

                    <div class="d-flex justify-content-between align-items-center mb-1">

                        <label class="form-label text-muted-light small fw-medium mb-0">
                            Password
                        </label>

                        <a href="#" class="small text-decoration-none text-gradient"
                            onclick="alert('Password reset instructions sent to your email address.')">
                            Forgot?
                        </a>

                    </div>

                    <div class="input-group-custom">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input type="password" id="passwordInput" class="form-control form-control-custom"
                            placeholder="••••••••" required>

                    </div>

                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check text-start">

                        <input class="form-check-input" type="checkbox" id="rememberMe">

                        <label class="form-check-label small text-muted-light" for="rememberMe">
                            Remember me
                        </label>

                    </div>

                </div>

                <!-- CHANGED: onclick structure -->
                <button type="button" id="loginSubmitBtn" class="btn btn-primary-glow w-100 py-3 mb-3"
                    onclick="handleLogin()">

                    Sign In
                    <i class="fa-solid fa-right-to-bracket ms-2"></i>

                </button>

            </form>

            <div class="auth-divider">
                <span>NEW TO AQUAVENTURE?</span>
            </div>

            <p class="mb-0 text-muted-light small">

                Don't have an account?

                <a href="A3-signup.html" class="text-gradient fw-bold text-decoration-none ms-1">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script>

        const API_URL = "http://localhost:8080/api/auth";


        // =========================================================
        // LOGIN
        // =========================================================

        function handleLogin() {

            let username = $('#usernameInput').val().trim();
            let password = $('#passwordInput').val().trim();


            // Validation
            if (!username) {
                showToast("Please enter Username.", "error");
                return;
            }

            if (!password) {
                showToast("Please enter Password.", "error");
                return;
            }


            // Show authenticating message
            showToast("Authenticating...", "success");

            $('#loginSubmitBtn').prop('disabled', true);


            // Create JSON object
            let obj = JSON.stringify({
                username: username,
                password: password
            });


            // Login API request
            $.ajax({

                url: API_URL + "/login",

                type: "POST",

                contentType: "application/json",

                data: obj,


                // =================================================
                // LOGIN SUCCESS
                // =================================================

                success: function (response) {

                    console.log("Login Response:", response);


                    // Get Access Token
                    const token =
                        response.body?.accessToken ||
                        response.data?.accessToken ||
                        response.accessToken;


                    // Get Role
                    const role =
                        response.body?.role ||
                        response.data?.role ||
                        response.role ||
                        "";


                    // Check token
                    if (token) {


                        // =========================================
                        // SAVE LOGIN INFORMATION
                        // =========================================

                        localStorage.setItem("JWT", token);

                        localStorage.setItem("username", username);

                        localStorage.setItem("role", role);


                        console.log("JWT Token saved successfully");


                        // Login successful
                        showToast(
                            "Login Successful! Redirecting...",
                            "success"
                        );


                        // =========================================
                        // REDIRECT
                        // =========================================

                        setTimeout(function () {

                            if (
                                role.toUpperCase() === "ADMIN" ||
                                role.toUpperCase() === "STAFF" ||
                                username.toLowerCase().includes("admin")
                            ) {

                                window.location.href = "dashboard.html";

                            } else {

                                window.location.href = "dashboard.html";

                            }

                        }, 1000);


                    } else {


                        // Token not received
                        showToast(
                            response.message ||
                            "Invalid Username or Password!",
                            "error"
                        );

                        $('#loginSubmitBtn').prop('disabled', false);

                    }

                },


                // =================================================
                // LOGIN ERROR
                // =================================================

                error: function (response) {

                    console.log("Login Error:", response);

                    $('#loginSubmitBtn').prop('disabled', false);


                    if (response.status === 403) {

                        showToast(
                            "Invalid Username or Password!",
                            "error"
                        );

                    } else {

                        showToast(
                            "Server unreachable. Please check backend status.",
                            "error"
                        );

                    }

                }

            });

        }


        // =========================================================
        // COMMON API REQUEST FUNCTION
        // =========================================================
        //
        // මෙතනින් පස්සේ protected API calls කරනකොට
        // Authorization Bearer Token එක automatically යනවා.
        //
        // =========================================================

        function apiRequest(url, method = "GET", data = null) {

            // Get JWT token from localStorage
            const token = localStorage.getItem("JWT");


            // Request headers
            const headers = {

                "Content-Type": "application/json"

            };


            // Token තියෙනවා නම් Bearer Token එක automatically add කරනවා
            if (token) {

                headers["Authorization"] = "Bearer " + token;

            }


            // AJAX settings
            const settings = {

                url: url,

                type: method,

                headers: headers,

                dataType: "json"

            };


            // Data තියෙනවා නම් request body එකට add කරනවා
            if (data !== null) {

                settings.data = JSON.stringify(data);

            }


            // Return AJAX request
            return $.ajax(settings);

        }


        // =========================================================
        // LOGOUT
        // =========================================================

        function logout() {

            // Remove JWT
            localStorage.removeItem("JWT");

            // Remove username
            localStorage.removeItem("username");

            // Remove role
            localStorage.removeItem("role");


            // Go to login page
            window.location.href = "A2-login.html";

        }


        // =========================================================
        // CHECK LOGIN
        // =========================================================

        function checkLogin() {

            const token = localStorage.getItem("JWT");


            // Token නැත්නම් login page එකට යවනවා
            if (!token) {

                window.location.href = "A2-login.html";

                return false;

            }


            return true;

        }


        // =========================================================
        // TOAST MESSAGE
        // =========================================================

        function showToast(msg, type) {

            $('#loginToast').text(msg);

            $('#loginToast')
                .removeClass('error success')
                .addClass(type)
                .show();

        }

    </script>


</body>

</html>
