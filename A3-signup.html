<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AquaVenture Water Sports & Boat Rentals</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="A3-signup.css">

    <style>
        .auth-wrapper {
            min-height: 100vh;
            position: relative;
            background: url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 15px;
        }

        .auth-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(7, 28, 48, 0.85) 0%, rgba(7, 28, 48, 0.96) 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: 40px 35px;
            position: relative;
            z-index: 2;
        }

        .form-control-custom {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            padding: 12px 16px 12px 45px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #10a7a1;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(16, 167, 161, 0.35);
        }

        .form-control-custom::placeholder {
            color: #94a3b8;
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #10a7a1;
            font-size: 1.1rem;
            z-index: 5;
        }

        .form-check-input {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-check-input:checked {
            background-color: #10a7a1;
            border-color: #10a7a1;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            margin: 25px 0;
            font-size: 0.85rem;
        }

        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .auth-divider span {
            padding: 0 10px;
        }

        .toast-msg {
            display: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-align: left;
        }
        .toast-msg.error { background: rgba(244, 63, 94, 0.2); border: 1px solid #f43f5e; color: #ff8e8e; }
        .toast-msg.success { background: rgba(16, 167, 161, 0.2); border: 1px solid #10a7a1; color: #34d399; }
    </style>
</head>
<body>

    <!-- Back to Home Floating Link -->
    <a href="index.html" class="btn btn-glass-secondary position-fixed top-0 start-0 m-4 z-3 d-flex align-items-center gap-2 text-decoration-none py-2 px-3">
        <i class="fa-solid fa-arrow-left"></i> Home
    </a>

    <div class="auth-wrapper">
        <div class="auth-overlay"></div>

        <div class="glass-card auth-card text-center">
            <!-- Brand Logo -->
            <div class="mb-4">
                <a href="index.html" class="text-decoration-none">
                    <div class="splash-kayak-icon mb-2" style="font-size: 2.8rem; color: #10a7a1;">
                        <i class="fa-solid fa-ship"></i>
                    </div>
                    <h2 class="fw-bold text-white mb-0" style="font-family: 'Manrope', sans-serif;">Aqua<span class="text-gradient">Venture</span></h2>
                </a>
                <p class="text-muted-light fs-7 mt-1">Join AquaVenture to book luxury speedboats & water safaris.</p>
            </div>

            <!-- Toast alert -->
            <div id="signupToast" class="toast-msg"></div>

            <!-- Registration Form -->
            <form id="signupForm">
                <div class="row g-3 mb-3 text-start">
                    <div class="col-md-6">
                        <label class="form-label text-muted-light small fw-medium">Full Name</label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input type="text" id="fullName" class="form-control form-control-custom" placeholder="Tharusha Perera" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted-light small fw-medium">Username</label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-at input-icon"></i>
                            <input type="text" id="username" class="form-control form-control-custom" placeholder="tharusha_p" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label text-muted-light small fw-medium">Email Address</label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" class="form-control form-control-custom" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label class="form-label text-muted-light small fw-medium">Contact Phone Number</label>
                    <div class="input-group-custom">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="contactNumber" class="form-control form-control-custom" placeholder="+94 77 123 4567" required>
                    </div>
                </div>

                <div class="row g-3 mb-3 text-start">
                    <div class="col-md-6">
                        <label class="form-label text-muted-light small fw-medium">Password</label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password" class="form-control form-control-custom" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted-light small fw-medium">Confirm Password</label>
                        <div class="input-group-custom">
                            <i class="fa-solid fa-shield-halved input-icon"></i>
                            <input type="password" id="confirmPassword" class="form-control form-control-custom" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                        <label class="form-check-label small text-muted-light" for="termsCheck">
                            I agree to the <a href="A5-terms of service.html" class="text-gradient text-decoration-none">Terms of Service</a> and <a href="A4-privacy policy.html" class="text-gradient text-decoration-none">Privacy Policy</a>.
                        </label>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary-glow w-100 py-3 mb-3">
                    Create Account <i class="fa-solid fa-user-plus ms-2"></i>
                </button>
            </form>

            <div class="auth-divider">
                <span>ALREADY HAVE AN ACCOUNT?</span>
            </div>

            <p class="mb-0 text-muted-light small">
                Existing member? 
                <a href="A2-login.html" class="text-gradient fw-bold text-decoration-none ms-1">Sign In</a>
            </p>
        </div>
    </div>

    <script>
    const API_URL = "http://localhost:8080/api/auth";

    const signupForm = document.getElementById("signupForm");
    const fullNameInput = document.getElementById("fullName");
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const contactNumberInput = document.getElementById("contactNumber");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const signupToast = document.getElementById("signupToast");
    const submitBtn = document.getElementById("submitBtn");


    signupForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        // ==========================================
        // PASSWORD VALIDATION
        // ==========================================

        if (passwordInput.value !== confirmPasswordInput.value) {
            showToast("Passwords do not match!", "error");
            return;
        }


        // ==========================================
        // CREATE REQUEST OBJECT
        // ==========================================

        const payload = {

            // Remove this if backend generates the ID
            userId: Date.now(),

            fullName: fullNameInput.value.trim(),
            username: usernameInput.value.trim(),
            email: emailInput.value.trim(),
            contactNumber: contactNumberInput.value.trim(),
            password: passwordInput.value,
            role: "CUSTOMER"
        };


        console.log("=================================");
        console.log("SIGNUP REQUEST");
        console.log("=================================");
        console.log("API URL:", `${API_URL}/register`);
        console.log("Payload:", payload);


        // ==========================================
        // UI
        // ==========================================

        showToast("Creating your account...", "success");
        submitBtn.disabled = true;


        try {

            // ==========================================
            // API REQUEST
            // ==========================================

            const res = await fetch(`${API_URL}/register`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(payload)

            });


            console.log("Response Status:", res.status);
            console.log("Response OK:", res.ok);


            // ==========================================
            // READ RESPONSE
            // ==========================================

            let responseData = null;

            try {
                responseData = await res.json();
                console.log("Response:", responseData);
            } catch (error) {
                console.log("Response is not JSON");
            }


            // ==========================================
            // SUCCESS
            // ==========================================

            if (res.ok) {

                console.log("USER SAVED SUCCESSFULLY");

                showToast(
                    "Account Created Successfully! Redirecting...",
                    "success"
                );

                setTimeout(function () {
                    window.location.href = "A2-login.html";
                }, 1200);

                return;
            }


            // ==========================================
            // API ERROR
            // ==========================================

            console.error("USER SAVE FAILED");

            let errorMessage = "Failed to create account.";

            if (responseData) {

                errorMessage =
                    responseData.message ||
                    responseData.error ||
                    responseData.body?.message ||
                    "Failed to create account.";
            }

            showToast(errorMessage, "error");

            submitBtn.disabled = false;

        } catch (error) {

            // ==========================================
            // NETWORK / BACKEND ERROR
            // ==========================================

            console.error("FETCH ERROR:", error);

            showToast(
                "Cannot connect to backend. Please check the server.",
                "error"
            );

            submitBtn.disabled = false;
        }

    });


    // ==========================================
    // TOAST
    // ==========================================

    function showToast(msg, type) {

        signupToast.textContent = msg;

        signupToast.className = `toast-msg ${type}`;

        signupToast.style.display = "block";
    }

</script>
</body>
</html>
